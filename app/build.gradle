plugins { id 'com.android.application' }

def appUrl = project.findProperty('appUrl') ?: 'https://example.com'
def appName = project.findProperty('appName') ?: 'My App'

android {
    namespace 'com.durjoy.webapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.durjoy.webapp'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
        resValue 'string', 'app_name', appName
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
}
